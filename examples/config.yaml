version: 1

clusters:
  gibbs:
    # Use an OpenSSH host alias. JoyRun inherits ~/.ssh/config, ssh-agent,
    # ProxyJump, known_hosts, usernames, ports, and keys from OpenSSH.
    host: gibbs
    scheduler: slurm
    remote_root: /scratch/your-user/joyrun
    # auto: Windows uses SFTP; Linux/macOS prefer rsync and fall back to SFTP.
    transfer: auto
    # Hardware facts are optional. Omit values you have not verified.
    partitions:
      community:
        cores_per_node: 64
        memory_per_node: 256GiB
      highio:
        cores_per_node: 64
        memory_per_node: 512GiB

targets:
  gibbs/orca:
    cluster: gibbs
    software:
      name: orca
    placement:
      default_partition: community
      allowed_partitions:
        - community
        - highio

    source:
      kind: file
      patterns:
        - "*.inp"

    params:
      cpus:
        type: int
        default: 32
        description: Number of CPU cores requested from Slurm.

      memory:
        type: string
        default: 150G
        description: Total Slurm memory request.

    script: |
      #!/bin/bash
      #SBATCH --cpus-per-task={{ .Params.cpus }}
      #SBATCH --mem={{ .Params.memory }}
      #SBATCH --partition={{ .Partition.Name }}
      #SBATCH --job-name={{ .Stem }}

      /share/software/orca/orca {{ .Input }} > {{ .Stem }}.out

    push:
      mode: entry
      limits:
        max_files: 20
        max_total_size: 2GiB
      exclude:
        - "*.out"
        - "*.tmp"

    pull:
      default:
        - "*.out"
        - "*.xyz"
        - "*.gbw"

    logs:
      - "{{ .Stem }}.out"

  gibbs/vasp:
    cluster: gibbs
    software:
      name: vasp
    placement:
      default_partition: community
      allowed_partitions:
        - community
        - highio

    source:
      kind: directory

    params:
      executable:
        type: string
        default: std
        choices:
          - std
          - gam
          - ncl

    script: |
      #!/bin/bash
      #SBATCH --nodes=4
      #SBATCH --ntasks=96
      #SBATCH --partition={{ .Partition.Name }}
      #SBATCH --job-name={{ .Name }}

      module load vasp
      srun vasp_{{ .Params.executable }}

    push:
      mode: workdir
      exclude:
        - OUTCAR
        - OSZICAR
        - WAVECAR
        - CHGCAR

    pull:
      default:
        - OUTCAR
        - CONTCAR
        - OSZICAR
        - vasprun.xml

    logs:
      - OUTCAR
      - OSZICAR
