name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - run: go mod verify
      - run: go test ./...
      - if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - name: Verify release version
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${VERSION}" >&2
            exit 1
          fi
          binary="${RUNNER_TEMP}/joyrun"
          if [ "${RUNNER_OS}" = Windows ]; then binary="${binary}.exe"; fi
          go build -trimpath -ldflags "-X main.version=${VERSION}" \
            -o "${binary}" ./cmd/joyrun
          test "$("${binary}" version)" = "joyrun ${VERSION}"

  build:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package="joyrun-${VERSION}-${GOOS}-${GOARCH}"
          mkdir -p "dist/${package}"
          binary="joyrun"
          if [ "${GOOS}" = windows ]; then binary="joyrun.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/${package}/${binary}" ./cmd/joyrun
          cp LICENSE NOTICE README.md SKILL.md CHANGELOG.md "dist/${package}/"
          cp -R docs examples "dist/${package}/"
          sed -i "s/__JOYRUN_VERSION__/${VERSION}/g" \
            "dist/${package}/SKILL.md"
          ! grep -q '__JOYRUN_VERSION__' "dist/${package}/SKILL.md"
          grep -q "${VERSION}" "dist/${package}/SKILL.md"
          if [ "${GOOS}" = windows ]; then
            (cd dist && zip -r "${package}.zip" "${package}")
          else
            tar -C dist -czf "dist/${package}.tar.gz" "${package}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: joyrun-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Add standalone documentation and installers
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cp scripts/install.sh scripts/install.ps1 dist/
          cp SKILL.md docs/agent-configuration.md dist/
          sed -i "s/__JOYRUN_VERSION__/${VERSION}/g" dist/SKILL.md
      - name: Verify archive contents
        shell: bash
        run: |
          set -euo pipefail
          sh -n dist/install.sh
          test -s dist/install.ps1
          test -s dist/SKILL.md
          test -s dist/agent-configuration.md
          ! grep -q '__JOYRUN_VERSION__' dist/SKILL.md
          for archive in dist/*.tar.gz; do
            listing=$(tar -tzf "${archive}")
            grep -q '/joyrun$' <<<"${listing}"
            grep -q '/LICENSE$' <<<"${listing}"
            grep -q '/NOTICE$' <<<"${listing}"
            grep -q '/README.md$' <<<"${listing}"
            grep -q '/SKILL.md$' <<<"${listing}"
            grep -q '/CHANGELOG.md$' <<<"${listing}"
            grep -q '/docs/agent-configuration.md$' <<<"${listing}"
            grep -q '/docs/commands.md$' <<<"${listing}"
            grep -q '/docs/troubleshooting.md$' <<<"${listing}"
            grep -q '/examples/smoke-config.yaml$' <<<"${listing}"
          done
          for archive in dist/*.zip; do
            listing=$(unzip -Z1 "${archive}")
            grep -q '/joyrun.exe$' <<<"${listing}"
            grep -q '/LICENSE$' <<<"${listing}"
            grep -q '/NOTICE$' <<<"${listing}"
            grep -q '/README.md$' <<<"${listing}"
            grep -q '/SKILL.md$' <<<"${listing}"
            grep -q '/CHANGELOG.md$' <<<"${listing}"
            grep -q '/docs/agent-configuration.md$' <<<"${listing}"
            grep -q '/docs/commands.md$' <<<"${listing}"
            grep -q '/docs/troubleshooting.md$' <<<"${listing}"
            grep -q '/examples/smoke-config.yaml$' <<<"${listing}"
          done
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum joyrun-*.tar.gz joyrun-*.zip install.sh install.ps1 \
            SKILL.md agent-configuration.md \
            > SHA256SUMS
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=(--verify-tag --generate-notes)
          assets=(
            dist/joyrun-*.tar.gz
            dist/joyrun-*.zip
            dist/install.sh
            dist/install.ps1
            dist/SKILL.md
            dist/agent-configuration.md
            dist/SHA256SUMS
          )
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" "${assets[@]}" "${args[@]}"
